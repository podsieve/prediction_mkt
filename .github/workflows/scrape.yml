name: Scrape Arena Leaderboard

on:
  # No cron here: GitHub's scheduler skipped most runs, so the every-2-hours
  # schedule lives in a launchd timer on the always-on Mac
  # (scripts/scraper_timer.sh). This workflow is the manual fallback.
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'manual run'

# Arena's Cloudflare blocks GitHub's hosted runners (HTTP 403), so this job runs
# on a self-hosted runner on a normal connection. Set one up with
# scripts/runner.sh; any machine registered with the label below can take it.
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: [self-hosted, arena-scraper]
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      # actions/setup-python assumes GitHub's hosted macOS layout (/Users/runner),
      # so build a venv from a Python already installed on the runner instead.
      - name: Set up Python
        run: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          PY="$(command -v python3.13 || command -v python3.12 || command -v python3.11 || true)"
          [ -n "$PY" ] || { echo "Install Python 3.11+ (brew install python@3.13)" >&2; exit 1; }
          "$PY" -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -m src.scraper

      - name: Check alerts and send email
        if: success()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python -m alerts.run events

      - name: Check scraper health
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python -m alerts.run health
